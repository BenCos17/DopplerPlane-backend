[project]
name = "dopplerplane-backend"
version = "0.1.0"
description = "Self-hosted cached ADS-B relay for DopplerPlane"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-anyio>=0.0.0,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]